components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-mc-session
      description: |
        სესიის token (256 ბიტი, base64url) — httpOnly, Secure, `SameSite=Lax`, host-only, `Path=/`
        (`__Host-`: ქვედომენი ვერ ჩაანაცვლებს). ბაზაში მხოლოდ sha256 ინახება; ვადა — `expiresAt` =
        min(ბოლო გაგრძელება + 30 წთ, შექმნა + 12 სთ) (B0 #10, `SESSION_IDLE_MINUTES` /
        `SESSION_MAX_HOURS`), გაგრძელება — `POST /auth/session`. ამოწურული / უცნობი → 401 და
        cookie-ები სუფთავდება. JS-ში და localStorage-ში არასოდეს.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        double-submit: სერვერი `__Host-mc-csrf` cookie-ს (არა httpOnly, Secure, `SameSite=Lax`,
        `Path=/`) აყენებს, ყოველი არა-GET მოთხოვნა მას ამ header-ით აბრუნებს (`http.js`-ის
        `readCsrfToken`). header = cookie და sha256(header) = სესიის `csrfHash` — სხვა შემთხვევაში 403.

  headers:
    SessionCookies:
      description: '`__Host-mc-session` (httpOnly) და `__Host-mc-csrf`; გასვლისას და ამოწურულ სესიაზე — ორივე `Max-Age=0`.'
      schema: { type: string }
    RetryAfter:
      description: წამები შემდეგ მცდელობამდე
      schema: { type: integer, minimum: 1 }

  parameters:
    Lang:
      name: lang
      in: query
      description: 'პასუხის ენა; თარგმანის გარეშე მასალა ქართულად ბრუნდება (`lang: ka`)'
      schema: { $ref: '#/components/schemas/Lang' }
    SlugPath:
      name: slug
      in: path
      required: true
      description: არასწორი ფორმის slug → 404 (არა 400), როგორც `query.js`-ის `find*`
      schema: { type: string, minLength: 1, maxLength: 200 }
    SearchQuery:
      name: q
      in: query
      description: ძიება (`QUERY_MAX` = 100; ზედმეტი იჭრება კლიენტზე)
      schema: { type: string, maxLength: 100 }
    Cursor:
      name: cursor
      in: query
      description: გაუმჭვირვალე; წინა პასუხის `nextCursor`
      schema: { type: string, minLength: 1, maxLength: 200 }
    PageLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 6 }
    Featured:
      name: featured
      in: query
      description: true — მხოლოდ რჩეული, false — რჩეულის გარეშე
      schema: { type: boolean }
    ItemIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ItemId' }
    MediaIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/MediaId' }
    UserIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UserId' }

  responses:
    BadRequest:
      description: არასწორი მოთხოვნა
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: bad-request
            message: 'მოთხოვნა არასწორია: ფილტრის ან გვერდის მნიშვნელობა ვერ ამოვიცანით.'
    Unauthorized:
      description: სესია არ არის / ამოიწურა, ან შესვლის მონაცემი არასწორია
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: unauthorized
            message: სესია ამოიწურა ან შესვლა საჭიროა. შედი ანგარიშში თავიდან.
    Forbidden:
      description: როლს უფლება არ აქვს, ან CSRF token არ ემთხვევა
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: forbidden
            message: ამ მოქმედებისთვის შენს როლს უფლება არ აქვს.
    NotFound:
      description: არ მოიძებნა
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: not-found
            message: მასალა ვერ მოიძებნა. შესაძლოა, ბმული შეიცვალა ან მასალა წაიშალა.
    Conflict:
      description: ვერსია შეიცვალა ან ფაილი გამოიყენება
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: conflict
            message: მასალა სხვამ შეცვალა, სანამ შენ არედაქტირებდი.
    Validation:
      description: ველის შეცდომა — `fields`
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                required: [fields]
          example:
            code: validation
            message: ფორმა ვერ გაიგზავნა — შეამოწმე მონიშნული ველები.
            fields:
              name: { code: required, message: ეს ველი სავალდებულოა. }
              cover.alt: { code: altMissing, message: '[შეტყობინება checks.*-იდან]' }
    RateLimited:
      description: ძალიან ბევრი მოთხოვნა
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: rate-limited
            message: ძალიან ბევრი მცდელობა. სცადე ცოტა ხანში.
    ServerError:
      description: სერვერის შეცდომა
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: server
            message: სერვერმა მოთხოვნა ვერ შეასრულა. სცადე ცოტა ხანში.

  schemas:
    # ─── შეცდომა და მომსახურება ──────────────────────────────────────────
    Error:
      type: object
      description: '`src/content/errors.js` — `ContentError.toJSON()`'
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string, minLength: 1 }
        fields:
          type: object
          description: |
            ველის გზა → შეცდომა. გზა — წერტილით და ინდექსით: `name`, `cover.alt`,
            `body[2].image.alt`, `translations.en.title`.
          propertyNames: { maxLength: 200 }
          additionalProperties: { $ref: '#/components/schemas/FieldError' }
      additionalProperties: false
    ErrorCode:
      type: string
      description: სერვერის კოდები; `network` და `unknown` — მხოლოდ კლიენტის (`ERROR_CODES`)
      enum:
        [
          bad-request,
          unauthorized,
          forbidden,
          not-found,
          conflict,
          validation,
          rate-limited,
          server,
        ]
    FieldError:
      type: object
      description: |
        `code` — `fieldErrors.*` (`required`, `email`, `contact`, `consent`, `tooLong`, `option`,
        `replyEmail`, `replyPhone`), ადმინისა (`invite`, `slugDuplicate`, `date`, `passwordShort`,
        `passwordCommon`) ან
        ჩეკლისტის `checks.*` კოდი (`altMissing`…).
      required: [code, message]
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        message: { type: string, minLength: 1 }
      additionalProperties: false
    Ok:
      type: object
      required: [ok]
      properties:
        ok: { const: true }
      additionalProperties: false
    Health:
      type: object
      required: [status, db]
      properties:
        status: { type: string, enum: [ok, degraded] }
        db: { type: string, enum: [up, down] }
      additionalProperties: false

    # ─── პრიმიტივები ─────────────────────────────────────────────────────
    Slug:
      type: string
      description: '`slug.js` — `SLUG_PATTERN`, `SLUG_MAX`'
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      maxLength: 80
    DateTime:
      type: string
      format: date-time
    Lang:
      type: string
      enum: [ka, en]
    Status:
      type: string
      description: '`model.js` — `STATUSES`'
      enum: [draft, scheduled, published]
    Ratio:
      type: string
      description: '`model.js` — `RATIOS`'
      enum: ['16:9', '3:2', '4:3', '1:1', '4:5']
    Href:
      type: string
      description: შიდა გზა (`/articles/…`) ან სრული URL
      minLength: 1
      maxLength: 2048
    NullableUrl:
      type: [string, 'null']
      description: '`null` — ბმული ჯერ უცნობია'
      maxLength: 2048
    YouTubeId:
      type: string
      description: '`youtube.js` — `YOUTUBE_ID` (11 სიმბოლო)'
      pattern: '^[A-Za-z0-9_-]{11}$'
    ItemId:
      type: string
      description: ტიპის პრეფიქსით — `a-` სტატია, `s-` სერია, `v-` ვიდეო, `n-` სიახლე, `e-` ღონისძიება, `p-` გვერდი
      pattern: '^[asvnep]-[0-9A-Za-z_]{1,64}$'
    MediaId:
      type: string
      description: გაუმჭვირვალე (ჩადგმული ფოტოს / ფაილის მისამართი B2 / B5-ში ზუსტდება)
      pattern: '^[\x21-\x7e]{1,200}$'
    UserId:
      type: string
      pattern: '^u-[0-9A-Za-z_]{1,64}$'
    CheckCode:
      type: string
      description: '`validate.js`-ის კოდი (`checks.*`)'
      pattern: '^[A-Za-z][A-Za-z0-9]{0,63}$'

    # ─── ტაქსონომია (`taxonomy.js`) ──────────────────────────────────────
    ArticleCategory:
      type: string
      enum: [growth, career, rights, accessibility, stories]
    ArticleSort:
      type: string
      enum: [newest, shortest]
    SeriesTopic:
      type: string
      enum: [habit, worldview, character, win-win, flow, time-priorities, self-reflection]
    SeriesTone:
      type: string
      enum: [navy, navy-deep, petrol, orange, alt]
    VideoCategory:
      type: string
      enum: [achievements, career, sport, art, everyday]
    NewsType:
      type: string
      enum: [announcement, event, program, media]
    EventFormat:
      type: string
      enum: [in-person, online, hybrid]
    AccessLevel:
      type: string
      enum: [yes, no, on-request, not-applicable]
    ContactTopic:
      type: string
      enum: [general, programs, volunteering, partnership, media, barrier, story]
    ReplyChannel:
      type: string
      enum: [email, call, message, sign-video]
    OfficeFeature:
      type: string
      enum: [entrance, elevator, restroom, parking, transit, guide-dog]
    PartnerKind:
      type: string
      enum: [company, donor, organization]
    SocialNetwork:
      type: string
      enum: [facebook, instagram, youtube, linkedin, tiktok]
    ContentType:
      type: string
      description: '`admin/content-types.js` — `CONTENT_TYPES`'
      enum: [articles, series, videos, news, events, pages]
    ContentTypeOrAll:
      type: string
      enum: [articles, series, videos, news, events, pages, all]
    CreatableType:
      type: string
      description: '`TYPE_CONFIG[type].creatable` — გვერდები არ იქმნება'
      enum: [articles, series, videos, news, events]
    Role:
      type: string
      description: '`admin/api/permissions.js` — `ROLES`'
      enum: [admin, editor]
    MediaKind:
      type: string
      enum: [image, document]

    # ─── მედია (`model.js`) ──────────────────────────────────────────────
    Image:
      type: object
      description: alt სავალდებულოა ყოველთვის (ცარიელი alt — გამოქვეყნების ბლოკერი, `altMissing`)
      required: [src, alt, ratio]
      properties:
        src: { type: [string, 'null'], maxLength: 2048 }
        alt: { type: string, maxLength: 1000 }
        ratio: { $ref: '#/components/schemas/Ratio' }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        credit: { type: string, maxLength: 200 }
      additionalProperties: false
    AudioTrack:
      type: object
      required: [src, srclang, label]
      properties:
        src: { type: [string, 'null'], maxLength: 2048 }
        srclang: { $ref: '#/components/schemas/Lang' }
        label: { type: string, maxLength: 200 }
        duration: { type: number, minimum: 0 }
      additionalProperties: false
    DocumentFile:
      type: object
      required: [src, label]
      properties:
        src: { type: [string, 'null'], maxLength: 2048 }
        label: { type: string, maxLength: 300 }
        size: { type: integer, minimum: 0 }
        lang: { $ref: '#/components/schemas/Lang' }
        tagged:
          { type: boolean, description: 'PDF/UA დადასტურებულია (არა → გაფრთხილება `pdfUntagged`)' }
      additionalProperties: false
    Translations:
      type: object
      description: |
        F9: ენის ვერსიები — `en`: ნაწილობრივი ასლი იმავე ფორმით, მხოლოდ ტექსტი (`localize.js`).
        მხოლოდ ადმინის მონაცემში; საჯარო პასუხში არ ხვდება. ტიპის მიხედვით დაზუსტება — B4.
      properties:
        en: { type: object, maxProperties: 64 }
      additionalProperties: false

    # ─── ტექსტის ბლოკები ─────────────────────────────────────────────────
    TextRun:
      type: object
      required: [type, text]
      properties:
        type: { const: text }
        text: { type: string, maxLength: 20000 }
        strong: { type: boolean, description: მუქი; კურსივი არ არსებობს }
        lang: { $ref: '#/components/schemas/Lang' }
      additionalProperties: false
    LinkRun:
      type: object
      required: [type, text, href]
      properties:
        type: { const: link }
        text: { type: string, maxLength: 500, description: 'აღწერითი („აქ“, „ვრცლად“ — ბლოკერი)' }
        href: { $ref: '#/components/schemas/Href' }
        lang: { $ref: '#/components/schemas/Lang' }
      additionalProperties: false
    Inline:
      oneOf:
        - $ref: '#/components/schemas/TextRun'
        - $ref: '#/components/schemas/LinkRun'
    Inlines:
      type: array
      maxItems: 500
      items: { $ref: '#/components/schemas/Inline' }
    ParagraphBlock:
      type: object
      required: [type, content]
      properties:
        type: { const: p }
        content: { $ref: '#/components/schemas/Inlines' }
      additionalProperties: false
    HeadingBlock:
      type: object
      description: H1 სტატიის სათაურია — ტექსტში მხოლოდ H2 / H3 (H3 მხოლოდ H2-ის შემდეგ — ბლოკერი)
      required: [type, text]
      properties:
        type: { type: string, enum: [h2, h3] }
        text: { type: string, maxLength: 500 }
      additionalProperties: false
    ListBlock:
      type: object
      required: [type, ordered, items]
      properties:
        type: { const: list }
        ordered: { type: boolean }
        items:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/Inlines' }
      additionalProperties: false
    QuoteBlock:
      type: object
      required: [type, text]
      properties:
        type: { const: quote }
        text: { type: string, maxLength: 5000 }
        cite: { type: string, maxLength: 300 }
      additionalProperties: false
    ImageBlock:
      type: object
      required: [type, image]
      properties:
        type: { const: image }
        image: { $ref: '#/components/schemas/Image' }
        caption: { type: string, maxLength: 1000 }
      additionalProperties: false
    LinkBlock:
      type: object
      required: [type, text, href]
      properties:
        type: { const: link }
        text: { type: string, maxLength: 500 }
        href: { $ref: '#/components/schemas/Href' }
        description: { type: string, maxLength: 1000 }
      additionalProperties: false
    Block:
      oneOf:
        - $ref: '#/components/schemas/ParagraphBlock'
        - $ref: '#/components/schemas/HeadingBlock'
        - $ref: '#/components/schemas/ListBlock'
        - $ref: '#/components/schemas/QuoteBlock'
        - $ref: '#/components/schemas/ImageBlock'
        - $ref: '#/components/schemas/LinkBlock'
    Blocks:
      type: array
      maxItems: 1000
      items: { $ref: '#/components/schemas/Block' }

    # ─── სტატია ───────────────────────────────────────────────────────────
    # *Props — სტრუქტურა (ტიპი, enum, ზედა ზღვარი, ცარიელი დასაშვებია): რედაქტორის მონახაზი (`*Draft`).
    # საჯარო სქემა (`Article`…) მას allOf-ით ამკაცრებს: სავალდებულო ველები, slug, თარიღი, `lang`.
    # სისრულე და ხელმისაწვდომობა გამოქვეყნებისას — `validate.js` (სერვერზეც, B4).
    ArticleProps:
      type: object
      properties:
        slug: { type: string, maxLength: 200 }
        title: { type: string, maxLength: 300 }
        excerpt: { type: string, maxLength: 1000 }
        category: { $ref: '#/components/schemas/ArticleCategory' }
        cover: { $ref: '#/components/schemas/Image' }
        author: { type: string, maxLength: 200 }
        status: { $ref: '#/components/schemas/Status' }
        publishedAt: { type: string, maxLength: 64 }
        updatedAt: { type: string, maxLength: 64 }
        featured: { type: boolean }
        body: { $ref: '#/components/schemas/Blocks' }
        audio:
          oneOf:
            - $ref: '#/components/schemas/AudioTrack'
            - type: 'null'
        readingMinutes:
          type: integer
          minimum: 0
          description: გამოთვლადი (`text.js` — 150 სიტყვა/წთ); სერვერი თავად ითვლის
    Article:
      type: object
      allOf:
        - $ref: '#/components/schemas/ArticleProps'
        - type: object
          required:
            - slug
            - title
            - excerpt
            - category
            - cover
            - author
            - status
            - publishedAt
            - featured
            - body
            - audio
            - readingMinutes
            - lang
          properties:
            slug: { $ref: '#/components/schemas/Slug' }
            excerpt: { type: string, maxLength: 160 }
            publishedAt: { $ref: '#/components/schemas/DateTime' }
            updatedAt: { $ref: '#/components/schemas/DateTime' }
            lang: { $ref: '#/components/schemas/Lang' }
      unevaluatedProperties: false
    ArticleSummary:
      type: object
      description: სიის ელემენტი — ტექსტისა და აუდიოს გარეშე
      allOf:
        - $ref: '#/components/schemas/ArticleProps'
        - type: object
          required:
            - slug
            - title
            - excerpt
            - category
            - cover
            - author
            - status
            - publishedAt
            - featured
            - readingMinutes
            - hasAudio
            - lang
          properties:
            slug: { $ref: '#/components/schemas/Slug' }
            excerpt: { type: string, maxLength: 160 }
            publishedAt: { $ref: '#/components/schemas/DateTime' }
            updatedAt: { $ref: '#/components/schemas/DateTime' }
            hasAudio: { type: boolean }
            lang: { $ref: '#/components/schemas/Lang' }
            body: false
            audio: false
      unevaluatedProperties: false
    ArticleDraft:
      type: object
      allOf:
        - $ref: '#/components/schemas/ArticleProps'
        - type: object
          properties:
            translations: { $ref: '#/components/schemas/Translations' }
      unevaluatedProperties: false
    ArticlePage:
      type: object
      required: [items, nextCursor, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ArticleSummary' }
        nextCursor: { type: [string, 'null'], maxLength: 200 }
        total: { type: integer, minimum: 0 }
      additionalProperties: false

    # ─── პიროვნული განვითარება ───────────────────────────────────────────
    Slide:
      type: object
      description: ცოცხალი ტექსტი, არა სურათი; `plain` — მარტივი ენის ვერსია (ბლოკერი, თუ ცარიელია)
      required: [id, kind, number, title, body, plain]
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        kind: { type: string, enum: [cover, step, summary] }
        number: { type: [integer, 'null'], minimum: 0 }
        title: { type: string, maxLength: 300 }
        body: { type: string, maxLength: 5000 }
        plain: { type: string, maxLength: 5000 }
        image:
          oneOf:
            - $ref: '#/components/schemas/Image'
            - type: 'null'
      additionalProperties: false
    SeriesProps:
      type: object
      properties:
        slug: { type: string, maxLength: 200 }
        title: { type: string, maxLength: 300 }
        topic: { $ref: '#/components/schemas/SeriesTopic' }
        excerpt: { type: string, maxLength: 1000 }
        tone: { $ref: '#/components/schemas/SeriesTone' }
        cover:
          oneOf:
            - $ref: '#/components/schemas/Image'
            - type: 'null'
        status: { $ref: '#/components/schemas/Status' }
        publishedAt: { type: string, maxLength: 64 }
        featured: { type: boolean }
        slides:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Slide' }
        pdf:
          oneOf:
            - $ref: '#/components/schemas/DocumentFile'
            - type: 'null'
        readingMinutes: { type: integer, minimum: 0 }
    Series:
      type: object
      allOf:
        - $ref: '#/components/schemas/SeriesProps'
        - type: object
          required:
            - slug
            - title
            - topic
            - excerpt
            - tone
            - cover
            - status
            - publishedAt
            - featured
            - slides
            - pdf
            - readingMinutes
            - lang
          properties:
            slug: { $ref: '#/components/schemas/Slug' }
            publishedAt: { $ref: '#/components/schemas/DateTime' }
            slides: { type: array, minItems: 1 }
            lang: { $ref: '#/components/schemas/Lang' }
      unevaluatedProperties: false
    SeriesSummary:
      type: object
      allOf:
        - $ref: '#/components/schemas/SeriesProps'
        - type: object
          required:
            - slug
            - title
            - topic
            - excerpt
            - tone
            - cover
            - status
            - publishedAt
            - featured
            - pdf
            - readingMinutes
            - slideCount
            - lang
          properties:
            slug: { $ref: '#/components/schemas/Slug' }
            publishedAt: { $ref: '#/components/schemas/DateTime' }
            slideCount: { type: integer, minimum: 1 }
            lang: { $ref: '#/components/schemas/Lang' }
            slides: false
      unevaluatedProperties: false
    SeriesDraft:
      type: object
      allOf:
        - $ref: '#/components/schemas/SeriesProps'
        - type: object
          properties:
            translations: { $ref: '#/components/schemas/Translations' }
      unevaluatedProperties: false

    # ─── ვიდეო (F10: მხოლოდ YouTube) ─────────────────────────────────────
    VideoPerson:
      type: object
      required: [name, role]
      properties:
        name: { type: string, maxLength: 200 }
        role: { type: string, maxLength: 200 }
      additionalProperties: false
    VideoYouTubeFields:
      type: object
      description: მონახაზში ცარიელი სტრიქონი დასაშვებია; ინახება id და არა URL (`parseYouTube`)
      required: [id]
      properties:
        id: { type: string, maxLength: 64 }
        adId: { type: string, maxLength: 64 }
      additionalProperties: false
    VideoYouTube:
      type: object
      description: '`adId` — აუდიოაღწერის ვერსია (სრული მიქსი, მთავარის სიგრძის); ≠ `id`'
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/YouTubeId' }
        adId: { $ref: '#/components/schemas/YouTubeId' }
      additionalProperties: false
    CaptionTrack:
      type: object
      description: |
        ჩვენი WebVTT (B0.1): ქართული (`captions`, `default: true`) სავალდებულოა გამოქვეყნებისთვის,
        ინგლისური — `subtitles`. `cues` / `end` ატვირთვისას ითვლება (`vtt.js`-ის `summarizeCues`).
      required: [kind, srclang, label, src, default]
      properties:
        kind: { type: string, enum: [captions, subtitles] }
        srclang: { $ref: '#/components/schemas/Lang' }
        label: { type: string, maxLength: 100 }
        src: { type: [string, 'null'], maxLength: 2048 }
        default: { type: boolean }
        cues: { type: integer, minimum: 0 }
        end: { type: number, minimum: 0 }
      additionalProperties: false
    TranscriptLine:
      type: object
      required: [start, kind, text]
      properties:
        start: { type: number, minimum: 0, description: წამებში }
        kind: { type: string, enum: [speech, description] }
        text: { type: string, maxLength: 5000 }
        speaker: { type: string, maxLength: 200 }
      additionalProperties: false
    VideoProps:
      type: object
      properties:
        slug: { type: string, maxLength: 200 }
        title: { type: string, maxLength: 300 }
        excerpt: { type: string, maxLength: 1000 }
        category: { $ref: '#/components/schemas/VideoCategory' }
        person: { $ref: '#/components/schemas/VideoPerson' }
        duration: { type: number, minimum: 0, description: 'წამებში, ხელით' }
        language: { $ref: '#/components/schemas/Lang' }
        status: { $ref: '#/components/schemas/Status' }
        publishedAt: { type: string, maxLength: 64 }
        featured: { type: boolean, description: „კვირის ვიდეო“ }
        youtube: { $ref: '#/components/schemas/VideoYouTubeFields' }
        captions:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/CaptionTrack' }
        transcript:
          type: array
          maxItems: 5000
          items: { $ref: '#/components/schemas/TranscriptLine' }
        visualInAudio:
          type: boolean
          description: „ვიზუალური ინფორმაცია აუდიოშიცაა“ — აუდიოაღწერის ვერსია არ სჭირდება
    Video:
      type: object
      allOf:
        - $ref: '#/components/schemas/VideoProps'
        - type: object
          required:
            - slug
            - title
            - excerpt
            - category
            - person
            - duration
            - language
            - status
            - publishedAt
            - featured
            - youtube
            - captions
            - transcript
            - lang
          properties:
            slug: { $ref: '#/components/schemas/Slug' }
            excerpt: { type: string, maxLength: 160 }
            publishedAt: { $ref: '#/components/schemas/DateTime' }
            youtube: { $ref: '#/components/schemas/VideoYouTube' }
            lang: { $ref: '#/components/schemas/Lang' }
      unevaluatedProperties: false
    VideoSummary:
      type: object
      allOf:
        - $ref: '#/components/schemas/VideoProps'
        - type: object
          required:
            - slug
            - title
            - excerpt
            - category
            - person
            - duration
            - language
            - status
            - publishedAt
            - featured
            - youtubeId
            - hasCaptions
            - hasAudioDescription
            - lang
          properties:
            slug: { $ref: '#/components/schemas/Slug' }
            excerpt: { type: string, maxLength: 160 }
            publishedAt: { $ref: '#/components/schemas/DateTime' }
            youtubeId:
              oneOf:
                - $ref: '#/components/schemas/YouTubeId'
                - type: 'null'
            hasCaptions: { type: boolean, description: ქართული ბილიკი არის }
            hasAudioDescription: { type: boolean, description: '`youtube.adId` არის' }
            lang: { $ref: '#/components/schemas/Lang' }
            youtube: false
            captions: false
            transcript: false
      unevaluatedProperties: false
    VideoDraft:
      type: object
      allOf:
        - $ref: '#/components/schemas/VideoProps'
        - type: object
          properties:
            translations: { $ref: '#/components/schemas/Translations' }
      unevaluatedProperties: false

    # ─── სიახლე და ღონისძიება ────────────────────────────────────────────
    NewsAction:
      type: object
      required: [text, href]
      properties:
        text: { type: string, maxLength: 100 }
        href: { $ref: '#/components/schemas/NullableUrl' }
      additionalProperties: false
    NewsProps:
      type: object
      properties:
        slug: { type: string, maxLength: 200 }
        title: { type: string, maxLength: 300 }
        excerpt: { type: string, maxLength: 1000 }
        type: { $ref: '#/components/schemas/NewsType' }
        cover: { $ref: '#/components/schemas/Image' }
        status: { $ref: '#/components/schemas/Status' }
        publishedAt: { type: string, maxLength: 64 }
        featured: { type: boolean }
        body: { $ref: '#/components/schemas/Blocks' }
        action:
          oneOf:
            - $ref: '#/components/schemas/NewsAction'
            - type: 'null'
    NewsItem:
      type: object
      allOf:
        - $ref: '#/components/schemas/NewsProps'
        - type: object
          required:
            [slug, title, excerpt, type, cover, status, publishedAt, featured, body, action, lang]
          properties:
            slug: { $ref: '#/components/schemas/Slug' }
            excerpt: { type: string, maxLength: 160 }
            publishedAt: { $ref: '#/components/schemas/DateTime' }
            lang: { $ref: '#/components/schemas/Lang' }
      unevaluatedProperties: false
    NewsSummary:
      type: object
      allOf:
        - $ref: '#/components/schemas/NewsProps'
        - type: object
          required: [slug, title, excerpt, type, cover, status, publishedAt, featured, action, lang]
          properties:
            slug: { $ref: '#/components/schemas/Slug' }
            excerpt: { type: string, maxLength: 160 }
            publishedAt: { $ref: '#/components/schemas/DateTime' }
            lang: { $ref: '#/components/schemas/Lang' }
            body: false
      unevaluatedProperties: false
    NewsDraft:
      type: object
      allOf:
        - $ref: '#/components/schemas/NewsProps'
        - type: object
          properties:
            translations: { $ref: '#/components/schemas/Translations' }
      unevaluatedProperties: false
    NewsPage:
      type: object
      required: [items, nextCursor, total, years]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NewsSummary' }
        nextCursor: { type: [string, 'null'], maxLength: 200 }
        total: { type: integer, minimum: 0 }
        years:
          type: array
          items: { type: integer, minimum: 1900, maximum: 2999 }
      additionalProperties: false
    EventAccessibility:
      type: object
      description: ყველა ველი სავალდებულოა — „უცნობი“ არასოდეს ჩანს „კი“-დ
      required: [wheelchair, signInterpreter, captions, format, notes]
      properties:
        wheelchair: { $ref: '#/components/schemas/AccessLevel' }
        signInterpreter: { $ref: '#/components/schemas/AccessLevel' }
        captions: { $ref: '#/components/schemas/AccessLevel' }
        format: { $ref: '#/components/schemas/EventFormat' }
        notes: { type: [string, 'null'], maxLength: 2000 }
      additionalProperties: false
    EventProps:
      type: object
      properties:
        slug: { type: string, maxLength: 200 }
        title: { type: string, maxLength: 300 }
        excerpt: { type: string, maxLength: 1000 }
        start: { type: string, maxLength: 64 }
        end: { type: string, maxLength: 64 }
        location: { type: string, maxLength: 500 }
        accessibility: { $ref: '#/components/schemas/EventAccessibility' }
        registrationUrl: { $ref: '#/components/schemas/NullableUrl' }
        newsSlug: { type: [string, 'null'], maxLength: 200 }
        status: { $ref: '#/components/schemas/Status' }
        publishedAt: { type: string, maxLength: 64 }
    Event:
      type: object
      allOf:
        - $ref: '#/components/schemas/EventProps'
        - type: object
          required:
            - slug
            - title
            - excerpt
            - start
            - end
            - location
            - accessibility
            - registrationUrl
            - newsSlug
            - status
            - publishedAt
            - lang
          properties:
            slug: { $ref: '#/components/schemas/Slug' }
            start: { $ref: '#/components/schemas/DateTime' }
            end: { $ref: '#/components/schemas/DateTime' }
            newsSlug:
              oneOf:
                - $ref: '#/components/schemas/Slug'
                - type: 'null'
            publishedAt: { $ref: '#/components/schemas/DateTime' }
            lang: { $ref: '#/components/schemas/Lang' }
      unevaluatedProperties: false
    EventDraft:
      type: object
      allOf:
        - $ref: '#/components/schemas/EventProps'
        - type: object
          properties:
            translations: { $ref: '#/components/schemas/Translations' }
      unevaluatedProperties: false

    # ─── ორგანიზაცია ──────────────────────────────────────────────────────
    TeamMemberProps:
      type: object
      properties:
        slug: { type: string, maxLength: 200 }
        name: { type: string, maxLength: 200 }
        role: { type: string, maxLength: 200 }
        bio: { type: string, maxLength: 1000 }
        photo: { $ref: '#/components/schemas/Image' }
        order: { type: integer, minimum: 0 }
    TeamMember:
      type: object
      description: შეზღუდვის ან ჯანმრთელობის ინფორმაცია პირად ბარათზე არ ინახება
      allOf:
        - $ref: '#/components/schemas/TeamMemberProps'
        - type: object
          required: [slug, name, role, bio, photo, order, lang]
          properties:
            slug: { $ref: '#/components/schemas/Slug' }
            lang: { $ref: '#/components/schemas/Lang' }
      unevaluatedProperties: false
    TeamMemberDraft:
      type: object
      allOf:
        - $ref: '#/components/schemas/TeamMemberProps'
        - type: object
          properties:
            translations: { $ref: '#/components/schemas/Translations' }
      unevaluatedProperties: false
    PartnerProps:
      type: object
      properties:
        slug: { type: string, maxLength: 200 }
        name: { type: string, maxLength: 200 }
        kind: { $ref: '#/components/schemas/PartnerKind' }
        logo: { $ref: '#/components/schemas/Image' }
        url: { $ref: '#/components/schemas/NullableUrl' }
    Partner:
      type: object
      allOf:
        - $ref: '#/components/schemas/PartnerProps'
        - type: object
          required: [slug, name, kind, logo, url, lang]
          properties:
            slug: { $ref: '#/components/schemas/Slug' }
            lang: { $ref: '#/components/schemas/Lang' }
      unevaluatedProperties: false
    PartnerDraft:
      type: object
      allOf:
        - $ref: '#/components/schemas/PartnerProps'
        - type: object
          properties:
            translations: { $ref: '#/components/schemas/Translations' }
      unevaluatedProperties: false
    Stage:
      type: object
      required: [id, year, text]
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        year: { type: string, maxLength: 20, description: ტექსტად — „2019“ ან „2019–2020“ }
        text: { type: string, maxLength: 1000 }
      additionalProperties: false

    # ─── საიტის პარამეტრები ──────────────────────────────────────────────
    SiteContacts:
      type: object
      required: [phone, email, messenger, signVideo, address]
      properties:
        phone: { type: string, maxLength: 100 }
        email: { type: string, maxLength: 200 }
        messenger:
          type: object
          required: [label, value, url]
          properties:
            label: { type: string, maxLength: 100 }
            value: { type: string, maxLength: 200 }
            url: { $ref: '#/components/schemas/NullableUrl' }
          additionalProperties: false
        signVideo:
          type: object
          required: [schedule, bookingUrl]
          properties:
            schedule: { type: string, maxLength: 300 }
            bookingUrl: { $ref: '#/components/schemas/NullableUrl' }
          additionalProperties: false
        address:
          type: object
          description: iframe-ის რუკა მხოლოდ `embedUrl`-ითაც და `directions`-ითაც (ტექსტური ალტერნატივა)
          required: [text, mapUrl, embedUrl, directions]
          properties:
            text: { type: string, maxLength: 300 }
            mapUrl: { $ref: '#/components/schemas/NullableUrl' }
            embedUrl: { $ref: '#/components/schemas/NullableUrl' }
            directions: { type: string, maxLength: 2000 }
          additionalProperties: false
      additionalProperties: false
    SiteLinks:
      type: object
      required: [privacy, vacancies, becomePartner, shareStory, accessibilityStatement]
      properties:
        privacy: { $ref: '#/components/schemas/NullableUrl' }
        vacancies: { $ref: '#/components/schemas/NullableUrl' }
        becomePartner: { $ref: '#/components/schemas/NullableUrl' }
        shareStory: { $ref: '#/components/schemas/NullableUrl' }
        accessibilityStatement: { $ref: '#/components/schemas/NullableUrl' }
      additionalProperties: false
    SiteSettingsProps:
      type: object
      properties:
        contacts: { $ref: '#/components/schemas/SiteContacts' }
        hours:
          type: array
          maxItems: 20
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string, maxLength: 200 }
              value: { type: string, maxLength: 200 }
            additionalProperties: false
        responseTime: { type: string, maxLength: 200 }
        officeAccessibility:
          type: array
          maxItems: 20
          items:
            type: object
            required: [feature, value]
            properties:
              feature: { $ref: '#/components/schemas/OfficeFeature' }
              value: { type: string, maxLength: 300 }
            additionalProperties: false
        faq:
          type: array
          maxItems: 50
          items:
            type: object
            required: [id, question, answer]
            properties:
              id: { type: string, minLength: 1, maxLength: 64 }
              question: { type: string, maxLength: 500 }
              answer: { type: string, maxLength: 5000 }
            additionalProperties: false
        social:
          type: array
          maxItems: 10
          items:
            type: object
            required: [network, url]
            properties:
              network: { $ref: '#/components/schemas/SocialNetwork' }
              url: { $ref: '#/components/schemas/NullableUrl' }
            additionalProperties: false
        socialHandle: { type: string, maxLength: 100 }
        team:
          type: object
          description: მხოლოდ ჯამური რიცხვი — პირად ბარათზე ეს ინფორმაცია არ ინახება
          required: [livedExperienceCount]
          properties:
            livedExperienceCount: { type: string, maxLength: 20 }
          additionalProperties: false
        links: { $ref: '#/components/schemas/SiteLinks' }
    SiteSettings:
      type: object
      allOf:
        - $ref: '#/components/schemas/SiteSettingsProps'
        - type: object
          required:
            - contacts
            - hours
            - responseTime
            - officeAccessibility
            - faq
            - social
            - socialHandle
            - team
            - links
            - lang
          properties:
            lang: { $ref: '#/components/schemas/Lang' }
      unevaluatedProperties: false
    SiteSettingsDraft:
      type: object
      allOf:
        - $ref: '#/components/schemas/SiteSettingsProps'
        - type: object
          properties:
            translations: { $ref: '#/components/schemas/Translations' }
      unevaluatedProperties: false

    # ─── გვერდები (ადმინი) ───────────────────────────────────────────────
    PageDraft:
      type: object
      description: |
        7 საჯარო გვერდი — სტრუქტურირებული ველები; „ჩვენ შესახებ“ — + გუნდი და პარტნიორები (შენახვისას
        საჯარო `getTeam` / `getPartners`-შიც აისახება) და „ჩვენი გზა“ (`stages`, B2: ბაზაში მისი
        ერთადერთი ადგილი; ადმინში ჯერ არ რედაქტირდება).
      properties:
        slug:
          type: string
          enum: [home, about, articles, development, videos, news, contact]
        title: { type: string, maxLength: 300 }
        path: { type: string, maxLength: 200 }
        status: { $ref: '#/components/schemas/Status' }
        publishedAt: { type: string, maxLength: 64 }
        fields:
          type: object
          properties:
            heading: { type: string, maxLength: 300 }
            lead: { type: string, maxLength: 2000 }
            description: { type: string, maxLength: 1000 }
          additionalProperties: false
        team:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/TeamMemberDraft' }
        partners:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/PartnerDraft' }
        stages:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/Stage' }
        translations: { $ref: '#/components/schemas/Translations' }
      additionalProperties: false

    # ─── ფორმები (საჯარო) ────────────────────────────────────────────────
    ContactPayload:
      type: object
      description: |
        სტრუქტურა აქ, შინაარსი — `forms.js`-ის `validateContact` (ერთი წესი ორივე მხარეს): ცარიელი
        სავალდებულო ველი, ტელეფონი / ელფოსტა, არხის შესაბამისობა, თანხმობა. ზღვრები = `NAME_MAX`,
        `CONTACT_MAX`, `MESSAGE_MAX`, `SUPPORT_MAX`. `support` — კომუნიკაციის მხარდაჭერა, არა დიაგნოზი.
      required: [name, contact, topic, message, replyVia, consent]
      properties:
        name: { type: string, maxLength: 100 }
        contact: { type: string, maxLength: 120, description: ტელეფონი ან ელფოსტა }
        topic: { $ref: '#/components/schemas/ContactTopic' }
        message: { type: string, maxLength: 4000 }
        support: { type: string, maxLength: 1000 }
        replyVia: { $ref: '#/components/schemas/ReplyChannel' }
        consent: { type: boolean }
        website: { type: string, maxLength: 500, description: honeypot — ცარიელი უნდა იყოს }
      additionalProperties: false
    ContactResult:
      type: object
      required: [ok, id]
      properties:
        ok: { const: true }
        id: { type: string, minLength: 1, maxLength: 100 }
      additionalProperties: false
    SubscribeRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, maxLength: 120 }
      additionalProperties: false
    SubscribeResult:
      type: object
      required: [ok]
      properties:
        ok: { const: true }
      additionalProperties: false

    # ─── ადმინი: სესია და მომხმარებლები ─────────────────────────────────
    LoginRequest:
      type: object
      description: ველები — `auth-forms.js`-ის `validateLogin`
      required: [email, password]
      properties:
        email: { type: string, maxLength: 120 }
        password: { type: string, maxLength: 1024 }
        remember: { type: boolean }
      additionalProperties: false
    RegisterRequest:
      type: object
      description: ველები — `validateRegister` (`PASSWORD_MIN` = 12, `NAME_MAX` = 100)
      required: [name, email, invite, password]
      properties:
        name: { type: string, maxLength: 100 }
        email: { type: string, maxLength: 120 }
        invite: { type: string, maxLength: 64 }
        password: { type: string, maxLength: 1024 }
      additionalProperties: false
    AdminUser:
      type: object
      required: [id, name, email, role, status]
      properties:
        id: { $ref: '#/components/schemas/UserId' }
        name: { type: string, maxLength: 200 }
        email: { type: string, maxLength: 200 }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [active, invited, deactivated] }
      additionalProperties: false
    Session:
      type: object
      required: [user, expiresAt]
      properties:
        user: { $ref: '#/components/schemas/AdminUser' }
        expiresAt: { $ref: '#/components/schemas/DateTime' }
      additionalProperties: false
    Editor:
      description: ვინ შეცვალა; `null` — უცნობი / წაშლილი მომხმარებელი
      oneOf:
        - type: object
          required: [id, name]
          properties:
            id: { $ref: '#/components/schemas/UserId' }
            name: { type: string, maxLength: 200 }
          additionalProperties: false
        - type: 'null'
    InviteRequest:
      type: object
      required: [role]
      properties:
        email:
          {
            type: string,
            maxLength: 120,
            description: არასავალდებულო — მოწვევა ამ ელფოსტაზე იზღუდება,
          }
        role: { $ref: '#/components/schemas/Role' }
      additionalProperties: false
    Invite:
      type: object
      required: [code, link, expiresAt, role]
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        link: { type: string, maxLength: 300, description: '`/admin/login?tab=register&invite=…`' }
        expiresAt: { $ref: '#/components/schemas/DateTime' }
        role: { $ref: '#/components/schemas/Role' }
      additionalProperties: false
    RoleRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/Role' }
      additionalProperties: false

    # ─── ადმინი: კონტენტი ────────────────────────────────────────────────
    IssueEntity:
      type: string
      enum: [article, series, video, news, event, team, partner, stage, settings]
    Issue:
      type: object
      description: '`validate.js` — `Issue`; `error` — გამოქვეყნების ბლოკერი, `warning` — გაფრთხილება'
      required: [severity, entity, id, field, code, message]
      properties:
        severity: { type: string, enum: [error, warning] }
        entity: { $ref: '#/components/schemas/IssueEntity' }
        id: { type: string, maxLength: 200 }
        field: { type: string, maxLength: 200 }
        code: { $ref: '#/components/schemas/CheckCode' }
        message: { type: string }
      additionalProperties: false
    IssueCounts:
      type: object
      required: [errors, warnings, codes]
      properties:
        errors: { type: integer, minimum: 0 }
        warnings: { type: integer, minimum: 0 }
        codes:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/CheckCode' }
      additionalProperties: false
    ContentRow:
      type: object
      required:
        - id
        - type
        - title
        - titleEn
        - slug
        - status
        - publishedAt
        - category
        - version
        - updatedAt
        - updatedBy
        - issues
      properties:
        id: { $ref: '#/components/schemas/ItemId' }
        type: { $ref: '#/components/schemas/ContentType' }
        title: { type: string }
        titleEn: { type: [string, 'null'], description: 'F9: `translations.en.title`, თუ არის' }
        slug: { type: string }
        status: { $ref: '#/components/schemas/Status' }
        publishedAt: { type: string }
        category: { type: [string, 'null'], description: ტაქსონომიის id; გვერდზე — გზა }
        version: { type: integer, minimum: 1 }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
        updatedBy: { $ref: '#/components/schemas/Editor' }
        issues: { $ref: '#/components/schemas/IssueCounts' }
      additionalProperties: false
    ContentList:
      type: object
      required: [items, total, page, pages, limit]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ContentRow' }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pages: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 50 }
      additionalProperties: false
    ItemDraft:
      description: |
        რედაქტორის მონახაზი — ცარიელი ველები დასაშვებია. სერვერი (B4) მას შენახული მასალის ტიპის
        სქემით ამოწმებს; გამოთვლადი ველები (`readingMinutes`) ხელახლა ითვლება.
      anyOf:
        - $ref: '#/components/schemas/ArticleDraft'
        - $ref: '#/components/schemas/SeriesDraft'
        - $ref: '#/components/schemas/VideoDraft'
        - $ref: '#/components/schemas/NewsDraft'
        - $ref: '#/components/schemas/EventDraft'
        - $ref: '#/components/schemas/PageDraft'
    WorkingCopy:
      type: object
      description: გამოქვეყნებულის ავტოშენახული სამუშაო ასლი — საიტზე „გამოქვეყნებამდე“ არ ჩანს
      required: [item, at, by]
      properties:
        item: { $ref: '#/components/schemas/ItemDraft' }
        at: { $ref: '#/components/schemas/DateTime' }
        by: { $ref: '#/components/schemas/Editor' }
      additionalProperties: false
    RecordBase:
      type: object
      required: [id, type, item, version, createdAt, updatedAt, updatedBy, issues, working]
      properties:
        id: { $ref: '#/components/schemas/ItemId' }
        version: { type: integer, minimum: 1 }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
        updatedBy: { $ref: '#/components/schemas/Editor' }
        issues:
          type: array
          items: { $ref: '#/components/schemas/Issue' }
        working:
          oneOf:
            - $ref: '#/components/schemas/WorkingCopy'
            - type: 'null'
    ArticleRecord:
      type: object
      allOf:
        - $ref: '#/components/schemas/RecordBase'
        - type: object
          properties:
            type: { const: articles }
            item: { $ref: '#/components/schemas/ArticleDraft' }
      unevaluatedProperties: false
    SeriesRecord:
      type: object
      allOf:
        - $ref: '#/components/schemas/RecordBase'
        - type: object
          properties:
            type: { const: series }
            item: { $ref: '#/components/schemas/SeriesDraft' }
      unevaluatedProperties: false
    VideoRecord:
      type: object
      allOf:
        - $ref: '#/components/schemas/RecordBase'
        - type: object
          properties:
            type: { const: videos }
            item: { $ref: '#/components/schemas/VideoDraft' }
      unevaluatedProperties: false
    NewsRecord:
      type: object
      allOf:
        - $ref: '#/components/schemas/RecordBase'
        - type: object
          properties:
            type: { const: news }
            item: { $ref: '#/components/schemas/NewsDraft' }
      unevaluatedProperties: false
    EventRecord:
      type: object
      allOf:
        - $ref: '#/components/schemas/RecordBase'
        - type: object
          properties:
            type: { const: events }
            item: { $ref: '#/components/schemas/EventDraft' }
      unevaluatedProperties: false
    PageRecord:
      type: object
      allOf:
        - $ref: '#/components/schemas/RecordBase'
        - type: object
          properties:
            type: { const: pages }
            item: { $ref: '#/components/schemas/PageDraft' }
      unevaluatedProperties: false
    ContentRecord:
      description: '`type` განსაზღვრავს `item`-ის სქემას'
      oneOf:
        - $ref: '#/components/schemas/ArticleRecord'
        - $ref: '#/components/schemas/SeriesRecord'
        - $ref: '#/components/schemas/VideoRecord'
        - $ref: '#/components/schemas/NewsRecord'
        - $ref: '#/components/schemas/EventRecord'
        - $ref: '#/components/schemas/PageRecord'
    UpdateRequest:
      type: object
      required: [data, version]
      properties:
        data: { $ref: '#/components/schemas/ItemDraft' }
        version: { type: integer, minimum: 1 }
        autosave: { type: boolean, default: false }
      additionalProperties: false
    PublishRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        data: { $ref: '#/components/schemas/ItemDraft' }
      additionalProperties: false
    ScheduleRequest:
      type: object
      required: [at, version]
      properties:
        at: { $ref: '#/components/schemas/DateTime' }
        version: { type: integer, minimum: 1 }
        data: { $ref: '#/components/schemas/ItemDraft' }
      additionalProperties: false
    VersionInfo:
      type: object
      required: [version, at, by, title, current]
      properties:
        version: { type: integer, minimum: 1 }
        at: { $ref: '#/components/schemas/DateTime' }
        by: { $ref: '#/components/schemas/Editor' }
        title: { type: string }
        current: { type: boolean }
      additionalProperties: false
    SlugAvailability:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
      additionalProperties: false
    YouTubeAvailability:
      type: object
      required: [available, usedBy]
      properties:
        available: { type: boolean }
        usedBy:
          oneOf:
            - type: object
              required: [id, title]
              properties:
                id: { $ref: '#/components/schemas/ItemId' }
                title: { type: string }
              additionalProperties: false
            - type: 'null'
      additionalProperties: false

    # ─── ადმინი: მედია ───────────────────────────────────────────────────
    MediaUsage:
      type: object
      required: [type, id, title, field]
      properties:
        type: { $ref: '#/components/schemas/ContentType' }
        id: { $ref: '#/components/schemas/ItemId' }
        title: { type: string }
        field:
          {
            type: string,
            maxLength: 200,
            description: 'ველის გზა: `cover`, `body[2].image`, `pdf`',
          }
      additionalProperties: false
    MediaItem:
      type: object
      required: [id, kind, src, alt, title, ratio, size, lang, tagged, usage]
      properties:
        id: { $ref: '#/components/schemas/MediaId' }
        kind:
          type: string
          enum: [image, document, track]
          description: '`track` — VTT, მხოლოდ ატვირთვის პასუხში (ბიბლიოთეკაში არ ჩანს)'
        src: { type: [string, 'null'], maxLength: 2048 }
        alt: { type: string, maxLength: 1000, description: "ფოტო — alt; დოკუმენტი — ''" }
        title: { type: string, maxLength: 300 }
        ratio:
          oneOf:
            - $ref: '#/components/schemas/Ratio'
            - type: 'null'
        size: { type: [integer, 'null'], minimum: 0, description: ბაიტებში }
        lang:
          oneOf:
            - $ref: '#/components/schemas/Lang'
            - type: 'null'
        tagged: { type: [boolean, 'null'], description: PDF/UA დადასტურებულია }
        usage:
          type: array
          items: { $ref: '#/components/schemas/MediaUsage' }
      additionalProperties: false
    MediaUpload:
      type: object
      description: '`multipart/form-data`; მეტა-ველები სტრიქონებია (`http.js` — `String(value)`)'
      required: [file]
      properties:
        file: { type: string, contentMediaType: application/octet-stream }
        alt: { type: string, maxLength: 1000 }
        title: { type: string, maxLength: 300 }
        ratio: { $ref: '#/components/schemas/Ratio' }
        lang: { $ref: '#/components/schemas/Lang' }
        tagged: { type: string, enum: ['true', 'false'] }
      additionalProperties: false
    MediaPatch:
      type: object
      description: ფოტო — `alt`; დოკუმენტი — `title`, `lang`, `tagged`
      minProperties: 1
      properties:
        alt: { type: string, maxLength: 1000 }
        title: { type: string, maxLength: 300 }
        lang: { $ref: '#/components/schemas/Lang' }
        tagged: { type: boolean }
      additionalProperties: false

    # ─── ადმინი: პარამეტრები და ანგარიშები ──────────────────────────────
    Featured:
      type: object
      description: რჩეული მასალის id-ები — თითო ტიპზე ერთი
      required: [weeklyVideo, featuredArticle, featuredSeries, featuredNews]
      properties:
        weeklyVideo: { oneOf: [{ $ref: '#/components/schemas/ItemId' }, { type: 'null' }] }
        featuredArticle: { oneOf: [{ $ref: '#/components/schemas/ItemId' }, { type: 'null' }] }
        featuredSeries: { oneOf: [{ $ref: '#/components/schemas/ItemId' }, { type: 'null' }] }
        featuredNews: { oneOf: [{ $ref: '#/components/schemas/ItemId' }, { type: 'null' }] }
      additionalProperties: false
    FeaturedPatch:
      type: object
      minProperties: 1
      properties:
        weeklyVideo: { oneOf: [{ $ref: '#/components/schemas/ItemId' }, { type: 'null' }] }
        featuredArticle: { oneOf: [{ $ref: '#/components/schemas/ItemId' }, { type: 'null' }] }
        featuredSeries: { oneOf: [{ $ref: '#/components/schemas/ItemId' }, { type: 'null' }] }
        featuredNews: { oneOf: [{ $ref: '#/components/schemas/ItemId' }, { type: 'null' }] }
      additionalProperties: false
    SettingsBundle:
      type: object
      required: [site, featured]
      properties:
        site: { $ref: '#/components/schemas/SiteSettingsDraft' }
        featured: { $ref: '#/components/schemas/Featured' }
      additionalProperties: false
    SettingsPatch:
      type: object
      minProperties: 1
      properties:
        site: { $ref: '#/components/schemas/SiteSettingsDraft' }
        featured: { $ref: '#/components/schemas/FeaturedPatch' }
      additionalProperties: false
    Stats:
      type: object
      required: [published, draft, scheduled, nextScheduledAt, a11yIssues, counts, library]
      properties:
        published: { type: integer, minimum: 0 }
        draft: { type: integer, minimum: 0 }
        scheduled: { type: integer, minimum: 0 }
        nextScheduledAt:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        a11yIssues: { type: integer, minimum: 0, description: მასალა ≥ 1 ბლოკერით }
        counts:
          type: object
          required: [articles, series, videos, news, events, pages]
          properties:
            articles: { type: integer, minimum: 0 }
            series: { type: integer, minimum: 0 }
            videos: { type: integer, minimum: 0 }
            news: { type: integer, minimum: 0 }
            events: { type: integer, minimum: 0 }
            pages: { type: integer, minimum: 0 }
          additionalProperties: false
        library:
          type: object
          required: [images, documents]
          properties:
            images: { type: integer, minimum: 0 }
            documents: { type: integer, minimum: 0 }
          additionalProperties: false
      additionalProperties: false
    A11yGroup:
      type: object
      required: [code, severity, count, types]
      properties:
        code: { $ref: '#/components/schemas/CheckCode' }
        severity: { type: string, enum: [error, warning] }
        count: { type: integer, minimum: 1 }
        types:
          type: array
          items:
            type: object
            required: [type, count]
            properties:
              type: { $ref: '#/components/schemas/ContentType' }
              count: { type: integer, minimum: 1 }
            additionalProperties: false
      additionalProperties: false
    A11yItem:
      type: object
      required: [id, type, title, titleEn, status, issues]
      properties:
        id: { $ref: '#/components/schemas/ItemId' }
        type: { $ref: '#/components/schemas/ContentType' }
        title: { type: string }
        titleEn: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/Status' }
        issues:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Issue' }
      additionalProperties: false
    A11yReport:
      type: object
      required: [totals, groups, items]
      properties:
        totals:
          type: object
          required: [errors, warnings, items]
          properties:
            errors: { type: integer, minimum: 0 }
            warnings: { type: integer, minimum: 0 }
            items: { type: integer, minimum: 0 }
          additionalProperties: false
        groups:
          type: array
          items: { $ref: '#/components/schemas/A11yGroup' }
        items:
          type: array
          items: { $ref: '#/components/schemas/A11yItem' }
      additionalProperties: false
