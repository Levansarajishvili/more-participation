    post:
      operationId: uploadMedia
      tags: [media]
      summary: ატვირთვა — ფოტო, PDF, სუბტიტრი (VTT)
      description: |
        ტიპი მოწმდება შიგთავსით (magic bytes, `src/content/files.js`) და არა სახელით: ფოტო — JPEG,
        PNG, WebP; დოკუმენტი — PDF (`%PDF-` … `%%EOF`); სუბტიტრი — VTT (`WEBVTT` + `vtt.js`-ის
        `parseCaptions`, დაზიანებული ფაილი არ ინახება). SVG, GIF, აუდიო / ვიდეო — არა.

        **ფაილის** დარღვევა → 400 `bad-request` + `fields.file` (`fileEmpty`, `fileType`,
        `fileMismatch` — გაფართოება ან გამოცხადებული MIME ≠ შიგთავსი, `fileTooLarge`,
