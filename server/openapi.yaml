openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: „მეტი ჩართულობა“ — API
  version: 0.1.0
  summary: საჯარო საიტის (`/api/v1`) და ადმინ პანელის (`/api/admin`) REST API.
  description: |
    კონტრაქტის წყარო — frontend-ის adapter-ები: `src/content/adapter.js` (`ContentAdapter`),
    `src/admin/api/adminAdapter.js` + `http.js` (`AdminAdapter`), შეცდომები — `src/content/errors.js`.
    ეს ფაილი ერთადერთი წყაროა: სერვერი route-ის სქემას აქედან იღებს (`server/lib/openapi.js`,
    `routeSchema(operationId)`), contract-ტესტი კი adapter-ის მოთხოვნებს და mock-ის პასუხებს ამოწმებს.

    **კონვენციები**
    - ერთი origin: API `/api/*`, CORS header-ები არ იგზავნება. ყოველ `/api/*` პასუხს აქვს
      `Cache-Control: no-store` (საჯარო GET-ის ქეში — B6) და `X-Robots-Tag: noindex, nofollow`.
    - მოთხოვნის სხეული — მხოლოდ `application/json` (მედიის ატვირთვა — `multipart/form-data`);
      `text/plain` არ მიიღება (CSRF-ის „მარტივი მოთხოვნა“). უცნობი ველი უარყოფილია (`additionalProperties`
      / `unevaluatedProperties: false`), ajv — `removeAdditional: false`.
    - თარიღი — ISO 8601 ოფსეტით (`2026-11-03T10:00:00+04:00`); ხანგრძლივობა — წამებში.
    - `lang` (`ka` | `en`) — საჯარო პასუხის ენა: თარგმანი (`translations.en`) ზემოდან ედება, პასუხში
      ემატება `lang`, `translations` არ ხვდება (`src/content/localize.js`).
    - ფაილის `src: null` — ფაილი ჯერ არ არის; URL `null` — ბმული ჯერ უცნობია (`model.js`).
    - ატვირთული ფაილი (B5): `src: /media/<key>` — `GET /media/{key}` (API-ს გარეთ, spec-ში
      ოპერაცია არ არის): საჯარო, `Cache-Control: public, max-age=31536000, immutable`, ETag / 304,
      `Content-Type` გაფართოებით + `nosniff`, CSP `default-src 'none'; sandbox`; PDF —
      `Content-Disposition: attachment`. უცნობი / წაშლილი → 404.

    **შეცდომა** — ყოველთვის `{ code, message, fields? }` (`Error`), `message` ქართულად:

    | HTTP | `code` | როდის |
    |---|---|---|
    | 400 | `bad-request` | არასწორი JSON / query / path, უცნობი ველი, ტიპი, ზომა, Content-Type |
    | 401 | `unauthorized` | სესია არ არის ან ამოიწურა; შესვლის არასწორი მონაცემი (ერთი პასუხი) |
    | 403 | `forbidden` | როლს უფლება არ აქვს (`x-permission`, `permissions.js`) |
    | 404 | `not-found` | მასალა / route არ არსებობს ან არ არის გამოქვეყნებული |
    | 409 | `conflict` | ვერსია შეიცვალა (`version`); გამოყენებული ფაილის წაშლა |
    | 422 | `validation` | ველის შეცდომა — `fields`: ველის გზა → `{ code, message }` |
    | 429 | `rate-limited` | ძალიან ბევრი მცდელობა (`Retry-After`) |
    | 500 | `server` | სერვერის შეცდომა (დეტალი მხოლოდ ლოგშია, პერსონალური მონაცემის გარეშე) |

    `network` და `unknown` მხოლოდ კლიენტის კოდებია (HTTP პასუხი არ არის). სხვა სტატუსი (413, 415…)
    სერვერი არ აბრუნებს — `normalizeError` მათ `unknown`-ად თარგმნიდა.

    **გაფართოებები:** `x-adapter` — frontend-ის ფუნქცია, რომელიც ოპერაციას იძახებს; `x-permission` —
    `permissions.js`-ის უფლება (route-ის guard, `server/lib/auth.js`); `x-rate-limit` — rate limit-ის
    პოლიტიკა (`auth` | `forms`, `config.rateLimit`; ოპერაციას 429 აქვს); `x-step` — ნაბიჯი, რომელშიც
    endpoint ხორციელდება (B1 — health; B3 — auth, users; B4 — content, settings, reports; B5 — media;
    B6 — საჯარო API).

    **უსაფრთხოება (B3):** სესია — `__Host-mc-session` (httpOnly), CSRF — `__Host-mc-csrf` +
    `X-CSRF-Token` (`security`-ის `session` / `csrf`). `/api/*`-ზე POST / PUT / PATCH / DELETE,
    რომლის `Sec-Fetch-Site` არის `cross-site` ან `same-site` → 403 `forbidden` (Fetch Metadata).
servers:
  - url: /
    description: 'ერთი origin — API და საიტი ერთ სერვისზეა (B0 #3, #4)'
security: []
tags:
  - name: system
    description: მომსახურება (health-check)
  - name: public
    description: საჯარო საიტი — `ContentAdapter` (B6)
  - name: auth
    description: ადმინის სესია (B3)
  - name: content
    description: კონტენტის მართვა (B4)
  - name: media
    description: ფოტოები, დოკუმენტები, სუბტიტრები (B5)
  - name: users
    description: მომხმარებლები და მოწვევები (B3)
  - name: settings
    description: საიტის პარამეტრები და რჩეული მასალა (B4)
  - name: reports
    description: დაფის სტატისტიკა და ხელმისაწვდომობის ანგარიში (B4)

paths:
  /api/health:
    get:
      operationId: getHealth
      tags: [system]
      summary: სერვისისა და ბაზის მდგომარეობა
      description: |
        ჰოსტინგის health-check (Render). ბაზასთან `ping` (≤ 2 წმ). ბაზის გარეშე — 503, რომ
        პლატფორმამ ინსტანცია ტრაფიკიდან ამოიღოს.
      x-step: B1
      responses:
        '200':
          description: სერვისი და ბაზა მუშაობს
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: ok, db: up }
        '503':
          description: ბაზა მიუწვდომელია
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: degraded, db: down }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/articles:
    get:
      operationId: listArticles
      tags: [public]
      summary: სტატიების სია — ფილტრი, ძიება, cursor
      description: |
        მხოლოდ საჯარო მასალა (`published`, ან `scheduled`, რომლის `publishedAt` დადგა). ძიება ქართულ
        ფორმებს ითვალისწინებს (`text.js`-ის `normalizeSearch` / `matchesQuery`). დალაგება: `newest` —
        `publishedAt` კლებადობით, `shortest` — `readingMinutes` ზრდადობით.
      x-adapter: listArticles
      x-step: B6
      parameters:
        - $ref: '#/components/parameters/Lang'
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/ArticleCategory' }
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageLimit'
        - name: sort
          in: query
          schema: { $ref: '#/components/schemas/ArticleSort' }
        - $ref: '#/components/parameters/Featured'
      responses:
        '200':
          description: გვერდი
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticlePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/articles/{slug}:
    get:
      operationId: getArticle
      tags: [public]
      summary: სტატია სრული ტექსტით
      x-adapter: getArticle
      x-step: B6
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/SlugPath'
      responses:
        '200':
          description: სტატია
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Article' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/series:
    get:
      operationId: listSeries
      tags: [public]
      summary: სერიები — რჩეული ჯერ, შემდეგ თემების რიგით
      x-adapter: listSeries
      x-step: B6
      parameters:
        - $ref: '#/components/parameters/Lang'
        - name: topic
          in: query
          schema: { $ref: '#/components/schemas/SeriesTopic' }
        - $ref: '#/components/parameters/Featured'
      responses:
        '200':
          description: სერიები (სლაიდების გარეშე)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SeriesSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/series/{slug}:
    get:
      operationId: getSeries
      tags: [public]
      summary: სერია სლაიდებით
      x-adapter: getSeries
      x-step: B6
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/SlugPath'
      responses:
        '200':
          description: სერია
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Series' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/videos:
    get:
      operationId: listVideos
      tags: [public]
      summary: ვიდეოები — ახალი ჯერ
      x-adapter: listVideos
      x-step: B6
      parameters:
        - $ref: '#/components/parameters/Lang'
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/VideoCategory' }
        - $ref: '#/components/parameters/Featured'
      responses:
        '200':
          description: ვიდეოები (სუბტიტრის და ტრანსკრიპტის გარეშე)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VideoSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/videos/{slug}:
    get:
      operationId: getVideo
      tags: [public]
      summary: ვიდეო — YouTube-ის id, სუბტიტრი (VTT), ტრანსკრიპტი
      x-adapter: getVideo
      x-step: B6
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/SlugPath'
      responses:
        '200':
          description: ვიდეო
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Video' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/news:
    get:
      operationId: listNews
      tags: [public]
      summary: სიახლეები — ტიპი, წელი, cursor
      description: '`years` — წლები, რომლებშიც არჩეული ტიპის სიახლე არსებობს (წლის ფილტრი), კლებადობით.'
      x-adapter: listNews
      x-step: B6
      parameters:
        - $ref: '#/components/parameters/Lang'
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/NewsType' }
        - name: year
          in: query
          schema: { type: integer, minimum: 1900, maximum: 2999 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/Featured'
      responses:
        '200':
          description: გვერდი
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/news/{slug}:
    get:
      operationId: getNews
      tags: [public]
      summary: სიახლე სრული ტექსტით
      x-adapter: getNews
      x-step: B6
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/SlugPath'
      responses:
        '200':
          description: სიახლე
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/events:
    get:
      operationId: listEvents
      tags: [public]
      summary: ღონისძიებები
      description: |
        `upcoming=true` — დასრულებამდე, `start` ზრდადობით; `false` — გასული, კლებადობით; პარამეტრის
        გარეშე — ყველა, `start` ზრდადობით.
      x-adapter: listEvents
      x-step: B6
      parameters:
        - $ref: '#/components/parameters/Lang'
        - name: upcoming
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: ღონისძიებები
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/team:
    get:
      operationId: getTeam
      tags: [public]
      summary: გუნდი — `order`-ის რიგით
      x-adapter: getTeam
      x-step: B6
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: გუნდის წევრები
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TeamMember' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/partners:
    get:
      operationId: getPartners
      tags: [public]
      summary: პარტნიორები
      x-adapter: getPartners
      x-step: B6
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: პარტნიორები
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Partner' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/stages:
    get:
      operationId: getStages
      tags: [public]
      summary: „ჩვენი გზა“ — ეტაპები
      x-adapter: getStages
      x-step: B6
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: ეტაპები
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Stage' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/settings:
    get:
      operationId: getSettings
      tags: [public]
      summary: საიტის პარამეტრები — კონტაქტი, საათები, ოფისი, FAQ, ბმულები
      x-adapter: getSettings
      x-step: B6
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: პარამეტრები
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteSettings' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/subscribe:
    post:
      operationId: subscribe
      tags: [public]
      summary: newsletter-ის გამოწერა
      description: |
        ელფოსტა მოწმდება `forms.js`-ის `validateSubscribe`-ით (422 + `fields.email`). Rate limit — IP-ით,
        CAPTCHA-ს გარეშე. B6: double opt-in — პასუხი `{ ok, status: 'pending' }` და
        `confirmSubscription(token)`; კონტრაქტი ორივე მხარეს B6-ში იცვლება.
      x-adapter: subscribe
      x-rate-limit: forms
      x-step: B6
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscribeRequest' }
      responses:
        '200':
          description: მიღებულია
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscribeResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/contact:
    post:
      operationId: sendContact
      tags: [public]
      summary: კონტაქტის ფორმა
      description: |
        შემოწმება — `forms.js`-ის `validateContact` (422 + `fields`, `CONTACT_FIELDS`-ის რიგით).
        honeypot (`website`) შევსებულია → ჩვეულებრივი `{ ok: true, id }`, შეტყობინება არ ინახება და არ
        იგზავნება. დიაგნოზი არ გროვდება — `support` მხოლოდ კომუნიკაციის საჭიროებაა. Rate limit — IP +
        საკონტაქტო მისამართი (B6), CAPTCHA და დროის ლიმიტი არ არის.
      x-adapter: sendContact
      x-rate-limit: forms
      x-step: B6
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactPayload' }
      responses:
        '200':
          description: მიღებულია
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
