<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!--
      mc-boot: თემა, შრიფტის ზომა და ინტერვალი პირველ რენდერამდე.
      კონტრაქტი — src/features/a11y/prefs.js; თანხვედრას src/theme-boot.test.js ამოწმებს.
      ES5, რადგან Vite ამ ბლოკს არ ამუშავებს. CSP-ის დანერგვისას ამ script-ს hash სჭირდება.
    -->
    <script id="mc-boot">
      (function (d, w) {
        // F9: ენა URL-იდან (`/en` — ინგლისური) — `<html lang>` პირველ რენდერამდე
        var path = (w.location && w.location.pathname) || '';
        d.documentElement.lang = /^\/en(\/|$)/.test(path) ? 'en' : 'ka';
        var THEMES = ['light', 'dark', 'contrast'];
        var SIZES = [100, 125, 150, 175, 200];
        var p = null;
        try {
          p = JSON.parse(w.localStorage.getItem('mc-a11y'));
        } catch (e) {
          p = null;
        }
        if (!p || typeof p !== 'object') p = {};

        var theme = THEMES.indexOf(p.theme) > -1 ? p.theme : null;
        if (!theme) {
          try {
            theme = w.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } catch (e) {
            theme = 'light';
          }
        }
        var size = Number(p.size);
        if (SIZES.indexOf(size) < 0) size = 100;

        var root = d.documentElement;
        root.setAttribute('data-theme', theme);
        root.setAttribute('data-size', String(size));
        root.setAttribute('data-spacing', p.spacing === true ? 'wide' : 'normal');

        var meta = d.querySelector('meta[name="color-scheme"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? 'light' : 'dark');
      })(document, window);
    </script>
    <!-- favicon: LogoSynergy-ის 16px ვერსია (ხუთი ნაჭერი + ჰაბი), public/favicon.svg -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>მეტი ჩართულობა</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>საიტის სანახავად ბრაუზერში ჩართე JavaScript.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
